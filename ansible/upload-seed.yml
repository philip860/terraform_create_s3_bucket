
---
- name: Upload seed file to Terraform-created S3 bucket
  hosts: localhost
  gather_facts: false

  vars:
    tf_dir: "../terraform"
    object_key: "seed/seed.txt"
    seed_file: "files/seed.txt"

  tasks:
    - name: Get bucket name from Terraform output
      ansible.builtin.command: terraform output -raw bucket_name
      args:
        chdir: "{{ tf_dir }}"
      register: tf_bucket
      changed_when: false
      failed_when: tf_bucket.rc != 0 or tf_bucket.stdout | trim == ""

    - name: Upload seed file
      amazon.aws.s3_object:
        bucket: "{{ tf_bucket.stdout | trim }}"
        object: "{{ object_key }}"
        src: "{{ seed_file }}"
        mode: put
